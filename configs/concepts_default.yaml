  - "an old bicycle leaning on a brick wall"
  - "a stack of books on a desk"
  - "a wooden bridge over a small stream"
  - "a hot air balloon over rolling hills"
  - "a sailboat on a calm lake"
  - "a train station with vintage architecture"
  - "a market stall with colorful awnings"
  - "a window box filled with herbs"
  - "an abstract pattern of geometric shapes"
  - "a macro photo of water droplets on a leaf"
  - "a row of colorful beach huts"
  - "a winding road through pine trees"
  - "a campfire surrounded by stones at night"
  - "a garden gnome on a lawn"
